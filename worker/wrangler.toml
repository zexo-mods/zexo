name = "zexo-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
[[d1_databases]]
binding = "DB"
database_name = "zexo-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "zexo-uploads"
[[r2_buckets]]
binding = "PUBLIC_ASSETS"
bucket_name = "zexo-public-assets"
[vars]
APP_ORIGIN = "https://YOUR-ZEXO-DOMAIN"
MAX_UPLOAD_BYTES = "104857600"