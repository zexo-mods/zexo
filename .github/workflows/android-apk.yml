name: ZEXO Android APK

on:
  push:
    branches: [main, feat/android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set ZEXO app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          content = path.read_text()
          import re
          content, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 2601', content, count=1)
          content, name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "26.1"', content, count=1)
          if not code_count or not name_count:
              raise SystemExit("Could not set Android versionCode/versionName in generated Gradle file")
          path.write_text(content)
          print("Configured ZEXO v26.1 (versionCode 2601)")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ZEXO-v26.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEXO-v26.1-APK
          path: ZEXO-v26.1.apk
          if-no-files-found: error
          retention-days: 14
