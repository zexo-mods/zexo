name: ZEXO Android APK

on:
  push:
    branches: [main, feat/android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set ZEXO app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          content = path.read_text()
          import re
          content, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 2601', content, count=1)
          content, name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "26.1"', content, count=1)
          if not code_count or not name_count:
              raise SystemExit("Could not set Android versionCode/versionName in generated Gradle file")
          path.write_text(content)
          print("Configured ZEXO v26.1 (versionCode 2601)")
          PY


      - name: Add ZEXO launcher logo
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          
          source = Path("ZeXO app logo with skin colors.webp")
          if not source.exists():
              raise SystemExit(f"Missing app logo: {source}")
          
          image = Image.open(source).convert("RGBA")
          res = Path("android/app/src/main/res")
          background = (8, 11, 18, 255)
          
          def contain(size, safe_size):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              logo = image.copy()
              logo.thumbnail((safe_size, safe_size), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              return canvas
          
          densities = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in densities.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              canvas = Image.new("RGBA", (size, size), background)
              logo = image.copy()
              logo.thumbnail((int(size * 0.78), int(size * 0.78)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size - logo.width) // 2, (size - logo.height) // 2))
              canvas.save(folder / "ic_launcher.png", optimize=True)
              canvas.save(folder / "ic_launcher_round.png", optimize=True)
          
          foreground_dir = res / "mipmap-xxxhdpi"
          contain(432, 324).save(foreground_dir / "ic_launcher_foreground.png", optimize=True)
          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          (adaptive_dir / "ic_launcher.xml").write_text(adaptive_xml)
          (adaptive_dir / "ic_launcher_round.xml").write_text(adaptive_xml)
          
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "ic_launcher_colors.xml"
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#080B12</color>
          </resources>
          ''')
          print("Generated ZEXO launcher icons from the repository logo.")
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ZEXO-v26.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEXO-v26.1-APK
          path: ZEXO-v26.1.apk
          if-no-files-found: error
          retention-days: 14
